<app-header></app-header>

<div class="page-container">
    <div class="welcome-text">Welcome, {{ username }}</div>

    <div class="main-box">
        <div class="profile-field">
            <div class="profile-data">
                <div class="avatar" [ngStyle]="styles"></div>
                <div class="login-field">
                    <div class="username">{{ username }}</div>
                    <div class="email">{{ email }}</div>
                </div>
            </div>

            @if (shownPage == pages.events) {
                <button class="profile-button" (click)="editProfile()">Edit</button>
            }
            @else if (shownPage == pages.editProfile) {
                <button style="margin-left: 700px;" class="profile-button" (click)="saveChanges()">Save</button>
                <button class="profile-button" (click)="returnToProfile()">Cancel</button>
            }
        </div>
        <!-- Show different pages in the profile -->
        @if (shownPage == pages.events) {
            <div class="header">Upcoming events</div>

            <app-user-tours [tourEvents]="userTours"></app-user-tours>
        }
        @else if (shownPage == pages.editProfile) {
            <app-edit-profile [username]="username" [email]="email"></app-edit-profile>
        }
    </div>
</div>
