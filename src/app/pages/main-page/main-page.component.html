 
<app-header [userData]="userData"></app-header>

 
<app-top-of-page></app-top-of-page>

 
<div style="margin-bottom: 140px;">
    <app-all-tours [userId]="userData.userId" [favTourIds]="favTourIds"></app-all-tours>
</div>

 
<div style="margin-bottom: 135px;">
    <app-top-destinations></app-top-destinations>
</div>


 
<div style="margin-bottom: 90px;">
    <app-short-search></app-short-search>
</div>


 
<div style="margin-bottom: 90px; max-width: 1200px; margin-left: auto; margin-right: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding: 0 20px;">
        <div>
            <div class="part-header" style="text-align: left; margin-bottom: 10px;">From The Gallery</div>
            <div style="font-size: 16px; color: #5A5A5A; font-family: Inter; line-height: 24px;">
                Explore the beautiful pictures from our tours.
            </div>
        </div>
        <button (click)="openImageModal()" style="background-color: black; color: white; padding: 12px 24px; border: none; cursor: pointer; 
                  font-family: Inter; font-size: 14px; font-weight: 500; text-transform: uppercase;">
            View All Images
        </button>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px; padding: 0 20px;">
        <img *ngFor="let img of galleryImages; let i = index" 
             [src]="img" 
             (click)="openImageModal(i)"
             style="width: 100%; height: 320px; object-fit: cover; border-radius: 4px; cursor: pointer;" 
             alt="Tour image">
    </div>
</div>

 
<div *ngIf="showImageModal" class="image-modal">
    <div class="modal-overlay" (click)="closeImageModal()"></div>
    <div class="modal-content">
        <button class="close-button" (click)="closeImageModal()">&times;</button>
        <img [src]="galleryImages[selectedImageIndex]" class="modal-image" alt="Tour image">
        <div class="navigation-buttons">
            <button class="nav-button prev-button" (click)="navigateImage('prev')">❮</button>
            <button class="nav-button next-button" (click)="navigateImage('next')">❯</button>
        </div>
    </div>
</div>

 
<div class="part-header" style="margin-bottom: 30px;">Reviews of our tourists</div>
<img style="width: 100%; margin: auto;" [src]="imageNames.reviews" alt="">

 
<app-footer></app-footer>
