<!-- HTML Template -->
<div class="tours-container">
<div class="search-container">
  <div class="search-fields-container">
    <div class="search-input-container">
      <input
        class="search-input"
        type="text"
        [(ngModel)]="searchQuery"
        (input)="fetchSearchResults(searchQuery)"
        placeholder="Search for your favourite destination"
        i18n
      />
      <img
        *ngIf="searchQuery"
        class="clear-icon"
        src="assets/images/clear.svg"
        alt="Clear"
        (click)="clearSearch()"
      />
      <img
        class="search-icon"
        src="assets/images/search.svg"
        alt="Search"
        i18n-alt
      />
      <ul class="search-dropdown" *ngIf="showDropdown">
        <li *ngFor="let tour of searchResults" (click)="onTourSelect(tour.id)">
          <div class="search-item-name">{{ tour.name }}</div>
          <div class="search-item-description">{{ tour.description }}</div>
          <div class="search-item-categories" *ngIf="tour.categories?.length">
            {{ tour.categories?.join(', ') }}
          </div>
        </li>
      </ul>
    </div>

    <div class="date-pickers-container">
      <div class="date-input-wrapper">
        <ejs-datepicker
          class="date-input" 
          [(ngModel)]="startDate"
          placeholder="Start Date" 
          (change)="onDateChange()"
        ></ejs-datepicker>
      </div>
      <span class="date-separator">—</span>
      <div class="date-input-wrapper">
        <ejs-datepicker
          class="date-input"
          [(ngModel)]="endDate"
          (change)="onDateChange()"
          placeholder="End Date"
        ></ejs-datepicker>
      </div>
    </div>
  </div>
</div>

  <div class="categories-container">
    @for (category of categories; track $index) {
      <div 
        class="category"
        [class.selected]="isCategorySelected(category.ID)" 
        (click)="toggleCategorySelection(category.ID)">
        {{ category.name }}
      </div>
    }
  </div>

  <div class="tours-grid">
    @for (tourEventData of tourEvents; track tourEventData) {
      <app-tour-card [tourEvent]="tourEventData" [userId]="userId" [favTourIds]="favTourIds"></app-tour-card>
    }
  </div>

  @if (hiddenTours.length > 0) {
    <div class="see-more" (click)="expandTours()" i18n>
      See More
    </div>
  }
