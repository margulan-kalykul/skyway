<div class="tour-type-text">Day Trip</div>
<div class="title-field">
    <div class="tour-title">{{tourEvent?.place}}</div>

    <div class="icon" style="margin-left: 50px;">
        <img class="icon-image" [src]="imageNames.favorite" alt="">
    </div>
    <div class="icon" style="margin-left: 15px;">
        <img class="icon-image" [src]="imageNames.share" alt="">
    </div>
</div>

<div class="rate-field">
    <div class="top-rated">
        Top Rated
    </div>
    <div class="stars">
        @for (i of [1, 2, 3, 4, 5]; track $index) {
            <div class="star">
                <img [src]="imageNames.star" alt="">
            </div>
        }
        <div class="rating">
            {{ 4.9 }}
        </div>
    </div>
</div>

<div class="visuals">
    <img class="tour-image" [src]="imageNames.tourImage" alt="">
    <div class="weather-panoramas">
        <div class="date-field">
            <img class="calendar-icon" [src]="imageNames.calendarIcon" alt="">
            <div class="date-text">{{today}}</div>
        </div>

        <div *ngIf="weather.condition.code > 0" class="weather-box">
            <div class="degrees">{{weather.temp_c}}&deg;</div>
            <div class="weather-text">{{weatherDate}}</div>
            <img class="weather-icon" [src]="weather.condition.icon" alt="">
        </div>

        <div class="instagram-box"></div>

        <div class="panoramas">

        </div>
    </div>
</div>


<div class="description">
    {{tourEvent?.Tour?.description}}
</div>
